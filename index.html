<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nocturne — From the path to the stair.</title>
<meta name="description" content="One continuous walk from the garden path to the stair hall, and the three fixtures that light it.">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{
  --ink:#f6f1e8; --ink-dim:rgba(246,241,232,.74); --brass:#d9b077;
  --glass:rgba(20,16,12,.42); --line:rgba(246,241,232,.24);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --gutter:clamp(20px,3.2vw,48px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b0a09}
body{background:#0b0a09;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}

/* The track gives the page its scroll length; the stage stays pinned. */
#track{position:relative;height:720vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#0b0a09}
#film,#clip{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#clip{opacity:0}
.stage.video #clip{opacity:1}
.stage.video #film{display:none}
.veil{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to top,rgba(8,6,5,.66) 0%,rgba(8,6,5,.18) 34%,rgba(8,6,5,0) 56%),
    linear-gradient(to bottom,rgba(8,6,5,.42) 0%,rgba(8,6,5,0) 16%)}

/* Header: logo and two quiet text controls, nothing else. */
header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--gutter)*.7) var(--gutter)}
.logo{font-family:var(--serif);font-size:1.7rem;letter-spacing:.01em}
.nav{display:flex;gap:clamp(16px,2.4vw,34px);align-items:center;position:relative}
.nav button{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);padding:10px 2px;transition:color .2s}
.nav button:hover{color:var(--ink)}
#projectBtn b{font-weight:500;color:var(--ink)}
#projectList{position:absolute;top:100%;right:0;min-width:270px;padding:16px 18px;background:var(--glass);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:14px;font-size:.88rem}
#projectList li{list-style:none;display:flex;justify-content:space-between;gap:18px;padding:6px 0}
#projectList .total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;color:var(--ink)}
#projectList .empty{color:var(--ink-dim)}

/* One headline per beat, one quiet price line. */
.beat{position:absolute;left:var(--gutter);bottom:calc(var(--gutter)*1.5);right:var(--gutter);z-index:4;pointer-events:none;max-width:56rem;opacity:0}
.beat h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,7vw,6rem);line-height:1.02;letter-spacing:-.01em;text-shadow:0 2px 40px rgba(0,0,0,.35)}
.beat p{margin-top:1.1rem;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);display:flex;flex-wrap:wrap;gap:.35rem 1.2rem}
.beat p span{color:var(--brass)}

.ticks{position:absolute;z-index:4;right:var(--gutter);bottom:calc(var(--gutter)*1.5);display:flex;gap:8px}
.ticks i{display:block;width:34px;height:2px;background:var(--line);position:relative;overflow:hidden}
.ticks i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(var(--f,0));transform-origin:left}
.cue{position:absolute;z-index:4;right:var(--gutter);bottom:calc(var(--gutter)*1.5 + 22px);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);text-align:right}
.cue::after{content:"";display:block;width:1px;height:34px;margin:10px 0 0 auto;background:linear-gradient(var(--ink-dim),transparent);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top;opacity:.4}50%{transform:scaleY(1);opacity:1}}

/* After the film: the product lineup, on warm paper. */
#lineup{background:#f3efe9;color:#1d1915;padding:clamp(48px,7vw,96px) var(--gutter) clamp(28px,3vw,44px)}
#lineup ::selection{background:#6e5642;color:#fff}
.lineup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,36px);max-width:1880px;margin:0 auto}
.prod{background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px -26px rgba(60,40,20,.28)}
.prod figure{position:relative;aspect-ratio:16/10;margin:0;background:#e9e2d8}
.prod img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;top:18px;left:18px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.94);font-size:.86rem;font-weight:500;color:#1d1915}
.prod .body{padding:clamp(22px,2vw,32px);display:flex;flex-direction:column;flex:1}
.prod .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.prod h3{font-size:clamp(1.15rem,1.45vw,1.45rem);font-weight:500;letter-spacing:-.01em;line-height:1.2}
.prod .from{color:#8a6a4b;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.prod .desc{margin-top:.8rem;color:#4a423a;line-height:1.5;padding-bottom:1.1rem;border-bottom:1px solid #ebe4da}
.prod .spec{padding:1rem 0;color:#756a5f;font-size:.88rem;line-height:1.6;border-bottom:1px solid #ebe4da}
.prod .acts{margin-top:auto;padding-top:1.4rem;display:flex;justify-content:space-between;align-items:center;gap:12px}
.buy{background:#6e5642;color:#fff;border-radius:999px;padding:12px 22px;font-size:.95rem;font-weight:500;transition:background .2s}
.buy:hover{background:#5a4535}
.buy.done{background:#2f2a25}
.room{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.room svg{width:12px;height:12px}
.prod .real{align-self:flex-start;margin-top:1rem;font-size:.88rem;color:#6e5642;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.prod .real:hover{color:#1d1915}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#lineup :focus-visible{outline-color:#6e5642}
.foot{display:flex;justify-content:space-between;align-items:center;max-width:1880px;margin:clamp(40px,5vw,72px) auto 0;padding-top:20px;border-top:1px solid #e3dbcf;font-size:.82rem;color:#756a5f}
.foot .logo{font-size:1.3rem;color:#1d1915}
.foot a{color:inherit;text-underline-offset:3px}
.add{white-space:nowrap;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border:1px solid var(--ink-dim);border-radius:999px;transition:background .2s,color .2s,border-color .2s}
.add:hover{background:var(--ink);color:#14110e;border-color:var(--ink)}
.add.done{background:var(--brass);border-color:var(--brass);color:#14110e}

/* Light Lab: the four light settings live here, off the film. */
#lab{position:fixed;inset:0;z-index:20;background:#0b0a09;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px)}
#lab .imgs{position:relative;overflow:hidden;background:#000}
#lab .imgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease}
#lab aside{padding:clamp(24px,3vw,44px);display:flex;flex-direction:column;gap:1.4rem;overflow:auto;border-left:1px solid var(--line)}
#lab .eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim)}
#lab h2{font-family:var(--serif);font-weight:400;font-size:2.1rem;line-height:1.05}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;letter-spacing:.08em;color:var(--ink-dim);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:#14110e;border-color:var(--ink)}
.seg button:not([aria-pressed="true"]):hover{border-color:var(--ink-dim);color:var(--ink)}
#labMeta{color:var(--ink-dim);font-size:.92rem;line-height:1.5}
/* Customize tab: continuous warmth and dimmer, previewed by blending the room's stills. */
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;align-self:flex-start}
.tabs button{padding:8px 16px;border-radius:999px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:rgba(246,241,232,.14);color:var(--ink)}
.tabs button:not([aria-selected="true"]):hover{color:var(--ink)}
.slider{display:flex;flex-direction:column;gap:.5rem}
.slider .lbl{display:flex;justify-content:space-between;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.slider output{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.slider input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--track)}
.slider input::-moz-range-track{height:4px;border-radius:2px;background:var(--track)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--ink);border:2px solid #0b0a09;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.slider input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid #0b0a09;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#kRange{--track:linear-gradient(90deg,#ff9f4a,#ffc98a 28%,#fff1de 58%,#dce8ff)}
#dRange{--track:linear-gradient(90deg,rgba(246,241,232,.14),var(--brass))}
.mix,.mix img,#mixLit{position:absolute;inset:0;width:100%;height:100%}
.mix img{object-fit:cover}
::selection{background:var(--brass);color:#14110e}

#labClose{position:absolute;top:calc(var(--gutter)*.7);left:var(--gutter);z-index:3;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}

@media (max-width:820px){
  .lineup{grid-template-columns:1fr;max-width:560px}
  .ticks,.cue{display:none}
  .beat{bottom:calc(var(--gutter)*1.6)}
  #lab{grid-template-columns:1fr;grid-template-rows:46% 1fr}
  #lab aside{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){.cue::after{animation:none}}
</style>
</head>
<body>

<div id="track">
  <div class="stage" id="stage">
    <canvas id="film" aria-label="A walk through the house at night, from the garden path to the stair hall"></canvas>
    <div class="veil"></div>

    <header>
      <div class="logo">Nocturne.</div>
      <div class="nav">
        <button id="labBtn" type="button">Light Lab</button>
        <button id="projectBtn" type="button" aria-expanded="false" aria-controls="projectList">Project <b id="projectCount">0</b></button>
        <div id="projectList" hidden></div>
      </div>
    </header>

    <div class="beat" id="beat" aria-live="polite"><h1 id="beatH"></h1><p id="beatP"></p></div>
    <div class="ticks" id="ticks" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="cue" id="cue" aria-hidden="true">Scroll</div>

  </div>
</div>

<section id="lineup" aria-label="The collection">
  <div class="lineup" id="cards"></div>
  <footer class="foot"><span class="logo">Nocturne.</span><a href="terms.html">Terms</a></footer>
</section>

<div id="lab" role="dialog" aria-modal="true" aria-labelledby="labTitle" hidden>
  <button id="labClose" type="button">Close</button>
  <div class="imgs"><img id="labA" alt="" src="assets/stills/stop_01_2200k.jpg" loading="lazy"><img id="labB" alt="" src="assets/stills/stop_01_2200k.jpg" loading="lazy" style="opacity:0">
    <div class="mix" id="mix" hidden><img id="mixOff" alt="" src="assets/stills/stop_01_off.jpg" loading="lazy"><div id="mixLit"><img id="mixLo" alt="" src="assets/stills/stop_01_2200k.jpg" loading="lazy"><img id="mixHi" alt="" src="assets/stills/stop_01_3500k.jpg" loading="lazy" style="opacity:0"></div></div>
  </div>
  <aside>
    <p class="eyebrow">Light Lab</p>
    <h2 id="labTitle">The Path</h2>
    <div class="seg" id="labStops" role="group" aria-label="Room"></div>
    <div class="tabs" role="tablist" aria-label="Light Lab view">
      <button type="button" role="tab" id="tabSet" aria-selected="true" aria-controls="labKelvin">Settings</button>
      <button type="button" role="tab" id="tabCustom" aria-selected="false" aria-controls="paneCustom" tabindex="-1">Customize</button>
    </div>
    <div class="seg" id="labKelvin" role="tabpanel" aria-labelledby="tabSet"></div>
    <div id="paneCustom" role="tabpanel" aria-labelledby="tabCustom" hidden style="display:flex;flex-direction:column;gap:1.2rem">
      <label class="slider"><span class="lbl">Warmth <output id="kOut" for="kRange">2200K</output></span>
        <input type="range" id="kRange" min="2200" max="6500" step="50" value="2200"></label>
      <label class="slider"><span class="lbl">Dimmer <output id="dOut" for="dRange">100%</output></span>
        <input type="range" id="dRange" min="0" max="100" step="1" value="100"></label>
    </div>
    <p id="labMeta"></p>
    <div><button class="add" id="labAdd" type="button">Add to project</button></div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
